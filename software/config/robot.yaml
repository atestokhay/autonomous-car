# Mekanik ölçüler. null olanlar ölçülüp doldurulacak (cetvel).
# Tüm uzunluklar METRE, açılar derece.

# --- Enkoder ---
# Jsumo ürün sayfası: "98 CPR (single channel)". İki kanalın iki kenarı sayıldığı için (x4)
# tekerlek mili başına 98*4 = 392 tick. Katalog değeri; aşama 3'te elle doğrulanır.
ticks_per_rev: 392

# --- Gövde ---
wheel_radius_m: null   # tekerlek yarıçapı (lastik dahil, cetvelle). Aşama 6 kalibrasyonu inceltir.
wheel_base_m: null     # sol-sağ tekerleğin yere temas noktaları arası. Aşama 6 kalibrasyonu inceltir.
robot_radius_m: 0.15   # LiDAR merkezinden gövdenin EN UZAK noktasına mesafe (güvenlik hesabı için)

# --- LiDAR montajı (base_link = iki tekerleğin ortası, x ileri, y sol) ---
lidar_x_m: 0.0         # LiDAR merkezi, tekerlek ekseninden ne kadar ileride (geride ise negatif)
lidar_y_m: 0.0         # sola pozitif
lidar_yaw_deg: 0.0     # LiDAR'ın 0° ekseni aracın ilerisine bakıyorsa 0. Kabloya doğru bakıyorsa farkı yaz.
lidar_inverted: false   # duvarlar sağ-sol AYNALI görünüyorsa true yap (notes/sorun-giderme.md)
