# slam_toolbox (online async) ayarları, S3 LiDAR + diferansiyel sürüş için başlangıç değerleri.
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_scan_matching: true
    use_scan_barycenter: true
    resolution: 0.05
    max_laser_range: 12.0          # iç mekân; S3 daha uzağı görür ama gürültü artar
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.2
    minimum_time_interval: 0.5
    transform_publish_period: 0.05
    map_update_interval: 2.0
    throttle_scans: 1
    do_loop_closing: true
    debug_logging: false
