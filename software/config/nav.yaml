# Duvar takibi parametreleri (aşama 7). Hızlar m/s, açılar derece, mesafeler metre.
wall_follow:
  side: right              # right | left : hangi tarafındaki duvarı takip edecek
  target_dist_m: 0.40      # duvara hedef mesafe (araç merkezinden)
  v_max: 0.30              # ilk denemelerde düşük tut; güvenle çalışınca artır
  v_min: 0.10
  w_max: 1.2               # rad/s
  max_accel: 0.8           # m/s^2 (komut yumuşatma)
  max_alpha: 4.0           # rad/s^2
  # güvenlik
  front_half_deg: 35       # "ön" sektörün yarı genişliği
  front_margin_m: 0.15     # robot_radius_m + bu = ön engelde dönüş eşiği
  hard_margin_m: 0.05      # robot_radius_m + bu = HER yönde acil dur eşiği
  slow_dist_m: 0.90        # ön engele bu kadar kalınca yavaşlamaya başla
  clear_dist_m: 0.55       # iç köşe dönüşü: ön bu kadar açılınca dönüşü bitir
  w_turn: 1.0              # iç köşe dönüş hızı (rad/s)
  # duvar çizgisi
  side_center_deg: 80      # duvar noktaları: yan sektör (takip edilen tarafta)
  side_half_deg: 40
  lost_dist_m: 1.3         # bundan uzaktaki noktalar duvar sayılmaz
  min_wall_pts: 12
  min_wall_span_m: 0.25    # duvar sayılması için çizginin asgari uzunluğu
  max_wall_rms_m: 0.04     # çizgiye uyum hatası bundan büyükse duvar sayılmaz
  # kontrol kazançları
  kd: 2.5                  # mesafe hatası(m) -> istenen yaklaşma açısı(rad)
  max_approach_rad: 0.7
  kh: 2.5                  # yönelim kazancı
  # duvar kaybı (dış köşe)
  lost_debounce_s: 0.15
  arc_radius_m: 0.40        # target_dist_m ile AYNI tut: duvar ucunu sabit mesafeyle dolanır
  v_arc: 0.18
  arc_max_s: 8.0
  v_search: 0.20

# Şerit ortalama + boşluk takibi (Fibonacci Autonomous Car pisti). Duvar takibi DEĞİLDİR (şartname AC-3.5):
# tek duvarı referans almaz; gövde genişliğinde en uzun açık koridora yönelir, düzlükte iki duvarın ortasında kalır.
# Yön: araç başlangıç çizgisine hakemin söylediği yöne bakacak şekilde konur; ayrıca sağ/sol ayarı gerekmez.
lane_follow:
  v_max: 0.30              # m/s (v_scale ile çarpılır)
  v_min: 0.08
  w_max: 2.5               # rad/s
  max_accel: 0.8           # m/s^2
  max_alpha: 6.0           # rad/s^2
  # gövde (şartname: en fazla 20 x 15 cm). LiDAR gövdenin ortasında varsayıldı; değilse ölçüp düzelt.
  half_width_m: 0.075      # gövde genişliğinin yarısı
  front_len_m: 0.10        # LiDAR merkezinden gövde önüne
  side_margin_m: 0.05      # koridor hesabında iki yana ek pay
  # boşluk takibi
  look_m: 1.5              # bundan uzağı "açık" sayılır
  search_half_deg: 100     # aday yönler: -100..+100 derece
  step_deg: 5
  straight_bias: 0.15      # düz gitmeyi hafif tercih (m / rad)
  kh: 2.0                  # yön kazancı
  # şerit ortalama (iki yanda da duvar varken)
  side_half_deg: 20
  lane_max_m: 0.50         # yan mesafe bundan küçükse "şerit duvarı" sayılır (şerit 60-80 cm)
  kc: 1.5
  max_center_rad: 0.35
  slow_dist_m: 0.60        # önde engel bu kadar yakınsa yavaşla
  # güvenlik / sıkışma
  front_stop_half_deg: 60  # yalnızca bu ön sektördeki yakın engel durdurur
  hard_margin_m: 0.03
  wait_max_s: 3.0          # önü kapalıysa (ör. önde robot) önce bu kadar bekle
  w_turn: 1.5              # sonra yerinde açık tarafa dön
  recover_clear_m: 0.40
  recover_max_s: 3.0
