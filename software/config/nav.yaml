# Duvar takibi parametreleri (aşama 7). Hızlar m/s, açılar derece, mesafeler metre.
wall_follow:
  side: right              # right | left : hangi tarafındaki duvarı takip edecek
  target_dist_m: 0.40      # duvara hedef mesafe (araç merkezinden)
  v_max: 0.30              # ilk denemelerde düşük tut; güvenle çalışınca artır
  v_min: 0.10
  w_max: 1.2               # rad/s
  max_accel: 0.8           # m/s^2 (komut yumuşatma)
  max_alpha: 4.0           # rad/s^2
  # güvenlik
  front_half_deg: 35       # "ön" sektörün yarı genişliği
  front_margin_m: 0.15     # robot_radius_m + bu = ön engelde dönüş eşiği
  hard_margin_m: 0.05      # robot_radius_m + bu = HER yönde acil dur eşiği
  slow_dist_m: 0.90        # ön engele bu kadar kalınca yavaşlamaya başla
  clear_dist_m: 0.55       # iç köşe dönüşü: ön bu kadar açılınca dönüşü bitir
  w_turn: 1.0              # iç köşe dönüş hızı (rad/s)
  # duvar çizgisi
  side_center_deg: 80      # duvar noktaları: yan sektör (takip edilen tarafta)
  side_half_deg: 40
  lost_dist_m: 1.3         # bundan uzaktaki noktalar duvar sayılmaz
  min_wall_pts: 12
  min_wall_span_m: 0.25    # duvar sayılması için çizginin asgari uzunluğu
  max_wall_rms_m: 0.04     # çizgiye uyum hatası bundan büyükse duvar sayılmaz
  # kontrol kazançları
  kd: 2.5                  # mesafe hatası(m) -> istenen yaklaşma açısı(rad)
  max_approach_rad: 0.7
  kh: 2.5                  # yönelim kazancı
  # duvar kaybı (dış köşe)
  lost_debounce_s: 0.15
  arc_radius_m: 0.40        # target_dist_m ile AYNI tut: duvar ucunu sabit mesafeyle dolanır
  v_arc: 0.18
  arc_max_s: 8.0
  v_search: 0.20
