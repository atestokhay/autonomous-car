# Tüm pinlerin TEK kaynağı (BCM numaraları). Fiziksel pin numarası yorumda.
# hardware/wiring/netlist.txt ile birebir aynı olmalı.
# Yön ters çıkarsa kabloyu değiştirme, ilgili satırdaki invert değerini çevir.

gpiochip: auto         # auto = `gpiodetect` ile pinctrl-rp1 çipini kendisi bulur. Bulamazsa sayı yaz (ör. 4 ya da 0).
pwm_hz: 2000           # L298N için PWM frekansı
encoder_pull_up: true  # Pi dahili pull-up (açık kollektör hall çıkışları için güvenli)

motors:                # her motora ayrı L298N, A kanalı (ENA jumper'ı çıkarılmış)
  left:  {pwm: 12, in1: 5,  in2: 6,  invert: false}   # pin 32, 29, 31
  right: {pwm: 13, in1: 16, in2: 20, invert: true}    # pin 33, 36, 38 (ayna montaj: ters bekleniyor, stage 02'de doğrula)

encoders:
  left:  {a: 17, b: 27, invert: false}                # pin 11, 13
  right: {a: 22, b: 23, invert: true}                 # pin 15, 16 (ayna montaj: ters bekleniyor, stage 03'te doğrula)

lidar:
  port: /dev/ttyUSB0
  baud: 1000000        # RPLIDAR S3 (eski modeller 115200 kullanır)
