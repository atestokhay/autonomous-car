# Tüm pinlerin TEK kaynağı (BCM numaraları). Fiziksel pin numarası yorumda.
# hardware/wiring/netlist.txt ile birebir aynı olmalı.
# Yön ters çıkarsa kabloyu değiştirme, ilgili satırdaki invert değerini çevir.

gpiochip: auto         # auto = `gpiodetect` ile pinctrl-rp1 çipini kendisi bulur. Bulamazsa sayı yaz (ör. 4 ya da 0).
pwm_hz: 2000           # TB6612FNG PWM frekansı (çip 100 kHz'e kadar destekler; lgpio yazılım PWM'i için 2 kHz yeterli)
encoder_pull_up: true  # Pi dahili pull-up (açık kollektör hall çıkışları için güvenli)

driver:                # tek TB6612FNG: A kanalı = sol motor, B kanalı = sağ motor
  stby: 26             # pin 37. LOW = sürücü kapalı (motorlar serbest). Yazılım açılışta HIGH, kapanışta LOW yapar.

motors:
  left:  {pwm: 12, in1: 5,  in2: 6,  invert: false}   # PWMA, AIN1, AIN2 → pin 32, 29, 31
  right: {pwm: 13, in1: 20, in2: 21, invert: true}    # PWMB, BIN1, BIN2 → pin 33, 38, 40 (ayna montaj: ters bekleniyor, stage 02'de doğrula)

encoders:
  left:  {a: 17, b: 27, invert: false}                # pin 11, 13
  right: {a: 23, b: 24, invert: true}                 # pin 16, 18 (ayna montaj: ters bekleniyor, stage 03'te doğrula)

imu:                   # BNO055 (I2C): odometride dönüş açısı (gyro). Bulunamazsa açı otomatik olarak enkoderden.
  i2c_bus: 1           # SDA = GPIO2 (pin 3), SCL = GPIO3 (pin 5)
  address: 0x28        # ADR pini boş/GND = 0x28, 3,3 V = 0x29
  use_for_heading: true
  mode: imuplus        # imuplus = ivme + gyro (manyetometre yok; motor/batarya mıknatısından etkilenmez). ndof = + pusula
  yaw_invert: false    # aracı elle SOLA çevirince açı AZALIYORSA true yap (kart ters takılı). Aşama 6: check_imu.py yon

start_button:          # Başlat butonu: bir ayağı GPIO16'ya (pin 36), diğer ayağı GND'ye (pin 34). Direnç gerekmez.
  gpio: 16             # pin 36. Dahili pull-up: basılı = LOW
  delay_s: 5           # basıldıktan kaç sn sonra program başlar (geri sayımda tekrar basmak = iptal)
  mode: lane           # lane = şerit ortalama (yarışma, AC-3.5'e uygun) / wall = eski duvar takibi
  side: right          # yalnızca mode: wall için: takip edilecek duvar right / left
  v_scale: 0.5         # hız ölçeği (ilk denemelerde 0.5; araç güvenilir olunca 1.0)

lidar:
  port: /dev/ttyUSB0
  baud: 1000000        # RPLIDAR S3 (eski modeller 115200 kullanır)
