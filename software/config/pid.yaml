# Başlangıç TAHMİNLERİ (N20 6 V 300 RPM için: kff ≈ 1 / 25 rad/s/duty). stages/04-pid/autotune.py çalışınca config/tuned.yaml bunların üstüne yazılır.
loop_hz: 100
speed_window: 4           # hız, son 4 döngü penceresinden hesaplanır (tick çözünürlüğünü artırır)
speed_alpha: 0.6          # pencere sonrası ek filtre (1.0 = filtre yok)
max_accel_rad_s2: 60.0    # hedef hız rampası
max_speed_rad_s: 20.0     # güvenlik sınırı (≈ 191 RPM). N20 300 RPM ≈ 31 rad/s boşta; yük ve 6 V altında ~%65'i güvenli pay

